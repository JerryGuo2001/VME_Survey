<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Picture Judgment Task</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px;
      text-align: center;
    }

    .screen {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .image-row {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 28px 0;
    }

    .ooo-image-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 18px;
      margin: 28px 0;
      flex-wrap: nowrap;
    }

    .choice-card {
      width: 380px;
      cursor: default;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }

    .ooo-choice-card {
      width: 260px;
      box-sizing: border-box;
      cursor: default;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 12px;
      background: #fafafa;
    }

    .choice-card.selected-choice,
    .ooo-choice-card.selected-choice {
      border-color: #222;
      box-shadow: 0 0 0 5px rgba(34, 34, 34, 0.18);
      background: #fff;
    }

    .choice-card img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background: #eee;
      border-radius: 8px;
    }

    .ooo-choice-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #eee;
      border-radius: 8px;
    }

    .choice-label,
    .ooo-choice-label {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      font-size: 16px;
      padding: 10px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .confidence-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .confidence-button {
      width: 70px;
      height: 55px;
      font-size: 20px;
    }

    .confidence-key-option {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;
      border-radius: 8px;
      cursor: default;
      user-select: none;
    }

    .small-text {
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <!-- Load helper files first, then the main task timeline. -->
  <script src="./js/data_save.js"></script>
  <script src="./js/survey.js"></script>
  <script src="./js/odd_one_out.js"></script>
  <script src="./js/task.js"></script>
</body>
</html>
